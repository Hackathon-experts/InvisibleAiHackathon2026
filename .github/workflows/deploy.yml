name: Test and Deploy
on:
  push:
    branches: [main, dev]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest

  deploy:
    needs: test
    runs-on: [self-hosted, invisibleai2026]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            export ENV_NAME=prod
            export PORT=8000
          else
            export ENV_NAME=staging
            export PORT=8001
          fi
          docker compose -p invisibleai2026-$ENV_NAME -f docker-compose.prod.yml up -d --build
          docker image prune -f
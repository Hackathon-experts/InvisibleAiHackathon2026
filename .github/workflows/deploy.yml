name: Test and Deploy
on:
  push:
    branches: [main, dev]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:

  deploy:
    needs: test
    runs-on: [self-hosted, invisibleai2026]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            export ENV_NAME=prod
            export PORT=8000
            export DEEPSEEK_API_KEY=sk-6870aeb6c8a142f295df65df835d3796
          else
            export ENV_NAME=staging
            export PORT=8001
            export DEEPSEEK_API_KEY=sk-6870aeb6c8a142f295df65df835d3796
          fi
          docker compose -p invisibleai2026-$ENV_NAME -f docker-compose.prod.yml up -d --build
          docker image prune -f
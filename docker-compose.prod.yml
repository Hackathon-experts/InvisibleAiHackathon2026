services:
  web:
    build: .
    container_name: invisibleai2026-${ENV_NAME}
    restart: unless-stopped
    env_file: /opt/stacks/hackathon-experts/invisibleai2026/.env.${ENV_NAME}
    ports:
      - "127.0.0.1:${PORT}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3